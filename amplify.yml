version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - corepack enable
        - yarn install
    build:
      commands:
        - yarn build
  artifacts:
    baseDirectory: dist # ou build, dependendo do seu framework
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
